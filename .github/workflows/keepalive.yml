name: Supabase keep-alive

# Free-tier Supabase projects pause after 7 days without activity. This calls a
# tiny database function every few days so the live demo never finds the
# database paused. Scheduled runs only happen on the default branch, and GitHub
# disables schedules after 60 days without repository activity.
on:
  schedule:
    # 09:17 UTC on days 1, 4, 7, ... of each month: never more than 3 days apart.
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping the database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call public.keepalive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
